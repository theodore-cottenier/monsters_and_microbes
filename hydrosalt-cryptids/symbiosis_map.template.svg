<svg xmlns="http://www.w3.org/2000/svg" width="2304" height="1830" viewBox="0 0 1536 1220" role="img" aria-labelledby="title description">
<title id="title">HydroSalts: a living vent food web</title>
<desc id="description">Fourteen illustrated vent organisms and one matrix housing attached to the volcanic spring tick share a hydrothermal habitat. Thirty directed relationships connect them; twenty-four do not involve the tick. Green is beneficial exchange, orange predation, red dashed parasitism, purple dotted viral infection, and blue commensal transport. Edge identifiers refer to the relationship table in the community overview.</desc>
